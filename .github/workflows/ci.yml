name: CI

on:
  pull_request:
  push:
    branches: [main]

# A failing stage fails the job. No step sets continue-on-error.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build shared packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # mongodb-memory-server downloads its binary on first use.
          MONGOMS_VERSION: 7.0.14

      - name: Build
        run: pnpm build
